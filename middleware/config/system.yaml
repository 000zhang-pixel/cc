poller:
  interval_seconds: 10

local_storage:
  root: ${LOCAL_STORAGE_ROOT}

publish:
  dewu:
    engine_script: "${PUBLISH_ENGINE_SCRIPT}"

notifications:
  enabled: true
  chat_id: "${NOTIFICATION_CHAT_ID}"
  notify_on:
    queued: false    # 待发布进队 — Base表可查，默认静默
    success: true    # 发布成功 — 运营确认用，可关
    failure: true    # 发布失败 — 必报，需人工处理
